<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>
 MADE BY ISHNTTc
   USS Eisenhower – Naval Combat</title>
<style>
/* ===========================
   BASE
=========================== */
* { box-sizing: border-box; }
body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; }
canvas { display: block; touch-action: none; }

/* ===========================
   SCREEN OVERLAYS
=========================== */
.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 200;
}
.screen.hidden { display: none; }

/* Scanline overlay for all screens */
.screen::before {
  content: ''; position: absolute; inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 3px,
    rgba(0,0,0,0.12) 3px, rgba(0,0,0,0.12) 4px
  );
  pointer-events: none; z-index: 1;
}
.screen > * { position: relative; z-index: 2; }

/* Start */
#start-screen {
  background: radial-gradient(ellipse at 50% 30%, #001829 0%, #000c1a 60%, #000 100%);
}

/* Pause */
#pause-screen {
  background: rgba(0, 8, 18, 0.88);
  backdrop-filter: blur(6px);
}

/* Game Over */
#gameover-screen {
  background: radial-gradient(ellipse at 50% 50%, #1a0000 0%, #0d0000 60%, #000 100%);
}

/* Mission Complete */
#complete-screen {
  background: radial-gradient(ellipse at 50% 50%, #001800 0%, #000d00 60%, #000 100%);
}

/* Screen title */
.screen-title {
  font-size: clamp(26px, 6vw, 62px);
  letter-spacing: 0.14em;
  font-weight: bold;
  text-align: center;
  margin-bottom: 6px;
  color: #00ffff;
  text-shadow: 0 0 24px #00ffff, 0 0 50px #00aaff;
}
#gameover-screen .screen-title  { color: #ff4040; text-shadow: 0 0 24px #ff4040; }
#complete-screen .screen-title  { color: #00ff88; text-shadow: 0 0 24px #00ff88; }

.screen-sub {
  font-size: clamp(10px, 2vw, 14px);
  color: #336688;
  letter-spacing: 0.28em;
  margin-bottom: 44px;
  text-align: center;
}

.screen-divider {
  width: 220px; height: 1px;
  background: linear-gradient(90deg, transparent, #00ffff, transparent);
  margin: 18px 0 30px;
}
#gameover-screen  .screen-divider { background: linear-gradient(90deg,transparent,#ff4040,transparent); }
#complete-screen  .screen-divider { background: linear-gradient(90deg,transparent,#00ff88,transparent); }

.screen-btn {
  padding: 13px 38px; background: transparent;
  border: 2px solid #00ffff; color: #00ffff;
  font-family: 'Courier New', monospace;
  font-size: 14px; font-weight: bold;
  letter-spacing: 0.18em; cursor: pointer;
  transition: background 0.15s, box-shadow 0.15s;
  margin: 6px; min-width: 210px; text-align: center;
}
.screen-btn:hover, .screen-btn:active {
  background: rgba(0,255,255,0.14);
  box-shadow: 0 0 18px rgba(0,255,255,0.4);
}
.screen-btn.red  { border-color: #ff4040; color: #ff4040; }
.screen-btn.red:hover, .screen-btn.red:active {
  background: rgba(255,64,64,0.14);
  box-shadow: 0 0 18px rgba(255,64,64,0.4);
}
.screen-btn.green { border-color: #00ff88; color: #00ff88; }
.screen-btn.green:hover, .screen-btn.green:active {
  background: rgba(0,255,136,0.14);
  box-shadow: 0 0 18px rgba(0,255,136,0.4);
}

#load-status {
  margin-top: 24px; font-size: 11px;
  color: #224466; letter-spacing: 0.2em;
}

/* ===========================
   HUD
=========================== */
#hud {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 50;
}
#hud.hidden { display: none; }

/* Status (top-left) */
#status-panel {
  position: absolute; top: 14px; left: 14px;
  color: #00ffff; background: rgba(0,10,22,0.76);
  padding: 9px 13px; border-left: 3px solid #00ffff;
  border-radius: 0 3px 3px 0; font-size: 11px; line-height: 1.9;
}

/* Health (top-right, offset for zoom slider) */
#health-wrap {
  position: absolute; top: 14px; right: 68px;
  width: 170px;
}
.bar-lbl { font-size: 9px; color: #00ffff; letter-spacing: 0.14em; margin-bottom: 4px; }
.bar-track {
  width: 100%; height: 11px;
  background: rgba(0,255,255,0.08);
  border: 1px solid #00ffff; border-radius: 2px; overflow: hidden;
}
#health-bar {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, #00ff88, #00ffcc);
  transition: width 0.3s, background 0.3s;
}

/* Mission (top-center) */
#mission-panel {
  position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
  background: rgba(0,10,22,0.78); border: 1px solid rgba(0,255,255,0.25);
  padding: 7px 14px; text-align: center; min-width: 210px;
}
#mission-name-hud  { font-size: 9px;  color: #336699; letter-spacing: 0.22em; }
#mission-obj-hud   { font-size: 11px; color: #00ffff; margin-top: 2px; }
#mission-prog-track { width: 100%; height: 3px; background: rgba(0,255,255,0.12); margin-top: 5px; }
#mission-prog-bar   { height: 100%; width: 0%; background: #00ffff; transition: width 0.3s; }

/* Radar (bottom-left) */
#radar-wrap {
  position: absolute; bottom: 118px; left: 14px;
}
#radar-canvas {
  display: block; border-radius: 50%;
  border: 2px solid rgba(0,220,100,0.55);
  box-shadow: 0 0 10px rgba(0,220,100,0.25), inset 0 0 16px rgba(0,18,0,0.9);
}
.radar-lbl { text-align: center; font-size: 8px; color: rgba(0,210,90,0.55); margin-top: 2px; letter-spacing: 0.14em; }

/* Ammo (bottom-right, above controls) */
#ammo-wrap {
  position: absolute; bottom: 118px; right: 14px;
  text-align: right; pointer-events: none;
}
#ammo-title  { font-size: 9px; color: #885500; letter-spacing: 0.14em; }
#ammo-count  { font-size: 30px; font-weight: bold; color: #ffaa00; line-height: 1; }
#reload-track { width: 55px; height: 4px; background: rgba(255,160,0,0.18); border: 1px solid #ffaa00; margin-top: 3px; margin-left: auto; }
#reload-fill  { height: 100%; width: 100%; background: #ffaa00; transition: width 0.05s linear; }

/* Damage flash */
#dmg-flash {
  position: absolute; inset: 0; pointer-events: none;
  background: rgba(255,0,0,0); transition: background 0.08s; z-index: 180;
}
#dmg-flash.on { background: rgba(255,0,0,0.38); }

/* ===========================
   ZOOM SLIDER
=========================== */
#zoom-container {
  position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: auto; z-index: 100;
}
#zoom-slider {
  writing-mode: vertical-lr; direction: ltr;
  width: 14px; height: 240px; accent-color: #00ffff; cursor: pointer;
}
.zlbl { color: #00ffff; font-size: 9px; font-weight: bold; }

/* ===========================
   CONTROLS
=========================== */
#controls {
  position: absolute; bottom: 28px; width: 100%;
  display: none; justify-content: space-between;
  padding: 0 18px; box-sizing: border-box;
  pointer-events: none; z-index: 100;
}
.btn-grp { display: flex; gap: 11px; align-items: center; pointer-events: auto; }

.btn {
  width: 62px; height: 62px;
  background: rgba(0,255,255,0.07);
  border: 2px solid rgba(0,255,255,0.48);
  border-radius: 50%; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: bold; font-family: 'Courier New', monospace;
  touch-action: none; transition: background 0.1s; -webkit-tap-highlight-color: transparent;
}
.btn:active { background: rgba(0,255,255,0.28); }

.btn.fire {
  width: 72px; height: 72px;
  border-color: #ffaa00; color: #ffaa00; font-size: 11px;
  background: rgba(255,170,0,0.09);
}
.btn.fire:active { background: rgba(255,170,0,0.38); }

.btn.pause-btn {
  width: 44px; height: 44px;
  font-size: 15px; border-color: rgba(255,255,255,0.28);
}
</style>
</head>

<!-- ========================================
     THREE.JS IMPORTS
======================================== -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
import { Water }       from 'three/addons/objects/Water.js';
import { Sky }         from 'three/addons/objects/Sky.js';

// ============================================================
//  SECTION 1 — GAME STATE
// ============================================================

const STATE = { START:'start', PLAYING:'playing', PAUSED:'paused', GAMEOVER:'gameover', COMPLETE:'complete' };
let gameState = STATE.START;

/** Switch the visible screen and toggle HUD / controls */
function setGameState(s) {
  gameState = s;
  ['start-screen','pause-screen','gameover-screen','complete-screen'].forEach(
    id => document.getElementById(id).classList.add('hidden')
  );
  const playing = s === STATE.PLAYING;
  document.getElementById('hud').classList.toggle('hidden', !playing);
  document.getElementById('controls').style.display   = playing ? 'flex' : 'none';
  document.getElementById('zoom-container').style.display = playing ? 'flex' : 'none';
  if (s === STATE.START)    document.getElementById('start-screen').classList.remove('hidden');
  if (s === STATE.PAUSED)   document.getElementById('pause-screen').classList.remove('hidden');
  if (s === STATE.GAMEOVER) document.getElementById('gameover-screen').classList.remove('hidden');
  if (s === STATE.COMPLETE) document.getElementById('complete-screen').classList.remove('hidden');
}

// ============================================================
//  SECTION 2 — MISSION DEFINITIONS
// ============================================================

const MISSIONS = [
  {
    id: 0,
    name: 'OPERATION IRON FIST',
    objective: 'Destroy 3 enemy ships',
    type: 'destroy',
    target: 3, progress: 0,
    enemyCount: 3,
  },
  {
    id: 1,
    name: 'OPERATION DEEP REACH',
    objective: 'Navigate to the objective zone',
    type: 'checkpoint',
    checkpointPos: null,   // assigned after scene init
    radius: 500,
    reached: false,
    enemyCount: 2,
  },
  {
    id: 2,
    name: 'OPERATION LAST STAND',
    objective: 'Survive for 90 seconds',
    type: 'survive',
    duration: 90, elapsed: 0,
    enemyCount: 4,
  },
];
let missionIdx    = 0;
let missionActive = false;

// ============================================================
//  SECTION 3 — PLAYER STATE
// ============================================================

let playerHP  = 100;
const MAX_HP  = 100;
let isAlive   = true;

let cannonReady = true;
const RELOAD_MS = 2400;
let reloadStart = 0;

let totalKills  = 0;
let shotsFired  = 0;
let gameTimeSec = 0;

// ============================================================
//  SECTION 4 — THREE.JS SCENE VARIABLES
// ============================================================

let scene, camera, renderer, water, ship, sky;
let speed = 0, targetSpeed = 0, zoomDist = 2500;
let theta = 0, phi = Math.PI / 3.5;
let isDragging = false, px = 0, py = 0;

const input = { l:false, r:false, g:false, s:false };

// Object collections (kept small for mobile performance)
const enemies          = [];   // enemy ship groups
const playerProj       = [];   // player cannon shells
const enemyProj        = [];   // enemy shells
const explosions       = [];   // active explosion bursts
const floatingObjs     = [];   // bobbing barrels / buoys
let   checkpointMarker = null;

const clock = new THREE.Clock();

// ============================================================
//  SECTION 5 — INITIALISATION
// ============================================================

init();

function init() {
  /* ----- Renderer ----- */
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // cap for mobile
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.toneMapping         = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled   = true;
  renderer.shadowMap.type      = THREE.PCFSoftShadowMap;
  document.body.insertBefore(renderer.domElement, document.body.firstChild);

  /* ----- Scene / Camera ----- */
  scene  = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0xaaccff, 0.00008);
  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 100000);

  /* ----- Lighting ----- */
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.5));

  const sun = new THREE.DirectionalLight(0xffffff, 2.0);
  sun.position.set(1000, 2000, 1000);
  sun.castShadow = true;
  sun.shadow.camera.left = sun.shadow.camera.bottom = -2000;
  sun.shadow.camera.right = sun.shadow.camera.top   =  2000;
  sun.shadow.mapSize.set(2048, 2048);
  scene.add(sun);

  /* ----- Sky ----- */
  sky = new Sky();
  sky.scale.setScalar(60000);
  scene.add(sky);
  const sunVec = new THREE.Vector3();
  sunVec.setFromSphericalCoords(1, THREE.MathUtils.degToRad(82), THREE.MathUtils.degToRad(180));
  sky.material.uniforms['sunPosition'].value.copy(sunVec);

  /* ---- Anisotropic Filtering (AF) ---- */
  const maxAF = renderer.capabilities.getMaxAnisotropy();

  /* ----- Water (with AF on normals texture) ----- */
  const waterNormals = new THREE.TextureLoader().load(
    'https://threejs.org/examples/textures/waternormals.jpg',
    tex => {
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.anisotropy = maxAF;   // ← AF applied
    }
  );
  water = new Water(new THREE.PlaneGeometry(120000, 120000), {
    textureWidth: 512, textureHeight: 512,
    waterNormals,
    sunDirection: sunVec,
    sunColor:    0xffffff,
    waterColor:  0x001e0f,
    distortionScale: 6.0,       // big rolling waves (preserved)
  });
  water.rotation.x = -Math.PI / 2;
  scene.add(water);

  /* ----- Ocean Environment ----- */
  buildIslands();
  buildFloatingObjects();

  /* ----- Load Player Ship ----- */
  new GLTFLoader().load(
    'https://cdn.jsdelivr.net/gh/ishhhnt/Model@main/uss_dwight_d.eisenhower_cvn-69_aircraft_carrier.glb',
    gltf => {
      ship = gltf.scene;
      // Centre the model (original logic preserved)
      const box    = new THREE.Box3().setFromObject(ship);
      const centre = box.getCenter(new THREE.Vector3());
      ship.children[0].position.x -= centre.x;
      ship.children[0].position.z -= centre.z;
      ship.scale.set(2, 2, 2);
      ship.position.set(0, -15, -400);
      ship.traverse(child => {
        if (child.isMesh) {
          child.castShadow = child.receiveShadow = true;
          // AF on ship textures
          if (child.material.map)          child.material.map.anisotropy          = maxAF;
          if (child.material.normalMap)    child.material.normalMap.anisotropy    = maxAF;
          if (child.material.roughnessMap) child.material.roughnessMap.anisotropy = maxAF;
        }
      });
      scene.add(ship);

      // Set Mission 2 checkpoint far ahead
      MISSIONS[1].checkpointPos = new THREE.Vector3(4500, 0, -5500);
      buildCheckpointMarker(MISSIONS[1].checkpointPos);

      // Mark model ready
      document.getElementById('load-status').textContent = '— READY TO DEPLOY —';
      document.getElementById('btn-play').textContent = '▶  DEPLOY CARRIER';
    },
    xhr => {
      const pct = Math.round((xhr.loaded / (xhr.total || 1)) * 100);
      document.getElementById('load-status').textContent = `LOADING… ${pct}%`;
    }
  );

  /* ----- Event Listeners ----- */
  setupControls();
  setupScreenButtons();
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ----- Start render loop immediately (water animates on start screen) ----- */
  animate();
}

// ============================================================
//  SECTION 6 — OCEAN ENHANCEMENTS
// ============================================================

/** Four low-poly islands at fixed world positions */
function buildIslands() {
  const configs = [
    { x:  5200, z: -4200, s: 1.2 },
    { x: -6500, z: -7800, s: 0.85 },
    { x:  8200, z:  3400, s: 1.5 },
    { x: -3200, z:  5200, s: 0.65 },
  ];
  configs.forEach(cfg => {
    const g = new THREE.Group();

    // Sandy base
    const base = new THREE.Mesh(
      new THREE.CylinderGeometry(280*cfg.s, 380*cfg.s, 55*cfg.s, 8),
      new THREE.MeshLambertMaterial({ color: 0xc8a86a })
    );
    base.receiveShadow = base.castShadow = true;
    g.add(base);

    // Rocky peak
    const rock = new THREE.Mesh(
      new THREE.ConeGeometry(150*cfg.s, 190*cfg.s, 6),
      new THREE.MeshLambertMaterial({ color: 0x887766 })
    );
    rock.position.y = 110*cfg.s;
    rock.castShadow = true;
    g.add(rock);

    // Green canopy
    const veg = new THREE.Mesh(
      new THREE.SphereGeometry(95*cfg.s, 6, 5),
      new THREE.MeshLambertMaterial({ color: 0x2e5c27 })
    );
    veg.position.y = 215*cfg.s;
    veg.castShadow = true;
    g.add(veg);

    g.position.set(cfg.x, -28, cfg.z);
    scene.add(g);
  });
}

/** Floating barrels & buoys that bob on the surface */
function buildFloatingObjects() {
  for (let i = 0; i < 18; i++) {
    const angle = Math.random() * Math.PI * 2;
    const dist  = 900 + Math.random() * 3200;
    const mesh  = new THREE.Mesh(
      new THREE.CylinderGeometry(14, 14, 28, 8),
      new THREE.MeshLambertMaterial({ color: Math.random() > 0.5 ? 0xff4400 : 0xffaa00 })
    );
    mesh.position.set(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);
    mesh.userData.fOffset = Math.random() * Math.PI * 2;
    mesh.userData.fSpeed  = 0.5 + Math.random() * 0.5;
    mesh.castShadow = true;
    scene.add(mesh);
    floatingObjs.push(mesh);
  }
}

/** Glowing ring + vertical beam that marks a checkpoint */
function buildCheckpointMarker(pos) {
  checkpointMarker = new THREE.Group();

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(330, 18, 8, 32),
    new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.82 })
  );
  ring.rotation.x = Math.PI / 2;
  checkpointMarker.add(ring);

  const beam = new THREE.Mesh(
    new THREE.CylinderGeometry(5, 5, 2200, 8),
    new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.28 })
  );
  beam.position.y = 1100;
  checkpointMarker.add(beam);

  checkpointMarker.position.copy(pos);
  checkpointMarker.visible = false;
  scene.add(checkpointMarker);
}

// ============================================================
//  SECTION 7 — ENEMY SYSTEM
// ============================================================

/** Creates a low-poly enemy warship at a world position */
function spawnEnemy(pos) {
  const g = new THREE.Group();

  // Hull
  const hull = new THREE.Mesh(
    new THREE.BoxGeometry(75, 18, 280),
    new THREE.MeshLambertMaterial({ color: 0x2a3a2a })
  );
  hull.castShadow = hull.receiveShadow = true;
  g.add(hull);

  // Superstructure
  const sup = new THREE.Mesh(
    new THREE.BoxGeometry(38, 28, 75),
    new THREE.MeshLambertMaterial({ color: 0x3a4a3a })
  );
  sup.position.set(0, 23, 25);
  sup.castShadow = true;
  g.add(sup);

  // Mast
  const mast = new THREE.Mesh(
    new THREE.CylinderGeometry(2.5, 2.5, 38, 5),
    new THREE.MeshLambertMaterial({ color: 0x555555 })
  );
  mast.position.set(0, 56, 25);
  g.add(mast);

  // Gun turret
  const turret = new THREE.Mesh(
    new THREE.BoxGeometry(14, 9, 22),
    new THREE.MeshLambertMaterial({ color: 0x222222 })
  );
  turret.position.set(0, 13, -75);
  g.add(turret);

  g.position.set(pos.x, -10, pos.z);
  g.userData = {
    hp:         3,
    speed:      0.7 + Math.random() * 0.7,
    fireCooldown: 3200 + Math.random() * 2000,
    lastFire:   Date.now() + 2500,
  };

  scene.add(g);
  enemies.push(g);
}

/** Spawn N enemies around the player in a ring */
function spawnEnemies(count) {
  const R = 3200;
  for (let i = 0; i < count; i++) {
    const a   = (i / count) * Math.PI * 2 + Math.random() * 0.6;
    const d   = R + Math.random() * 1400;
    const ref = ship ? ship.position : new THREE.Vector3();
    spawnEnemy(new THREE.Vector3(ref.x + Math.cos(a)*d, 0, ref.z + Math.sin(a)*d));
  }
}

/** Each frame: move enemies toward player, fire when in range */
function updateEnemies() {
  if (!ship) return;
  const now = Date.now();

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (!e.parent) { enemies.splice(i, 1); continue; }

    const toPlayer = new THREE.Vector3().subVectors(ship.position, e.position);
    const dist     = toPlayer.length();

    // Move toward player, stop at a safe distance
    if (dist > 380) {
      e.position.addScaledVector(toPlayer.normalize(), e.userData.speed);
    }

    // Always face player
    e.lookAt(ship.position.x, e.position.y, ship.position.z);

    // Shoot when close enough
    if (dist < 2600 && now - e.userData.lastFire > e.userData.fireCooldown) {
      fireEnemyShell(e);
      e.userData.lastFire = now;
    }
  }
}

/** Enemy fires one inaccurate shell toward the player */
function fireEnemyShell(enemy) {
  const shell = new THREE.Mesh(
    new THREE.SphereGeometry(7, 6, 6),
    new THREE.MeshBasicMaterial({ color: 0xff4400 })
  );
  shell.position.copy(enemy.position).setY(enemy.position.y + 14);

  const dir = new THREE.Vector3().subVectors(ship.position, enemy.position).normalize();
  dir.x += (Math.random() - 0.5) * 0.28;   // spread / inaccuracy
  dir.z += (Math.random() - 0.5) * 0.28;
  dir.normalize();

  shell.userData = { vel: dir.multiplyScalar(16), life: 220 };
  scene.add(shell);
  enemyProj.push(shell);
}

// ============================================================
//  SECTION 8 — PLAYER WEAPONS
// ============================================================

/** Fire a cannon shell in the direction the ship is facing */
function playerFire() {
  if (!cannonReady || !isAlive || gameState !== STATE.PLAYING || !ship) return;

  cannonReady = false;
  reloadStart = Date.now();
  shotsFired++;

  const shell = new THREE.Mesh(
    new THREE.SphereGeometry(11, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xffdd00 })
  );
  shell.position.copy(ship.position).setY(ship.position.y + 28);

  const dir = new THREE.Vector3(-Math.sin(ship.rotation.y), 0, -Math.cos(ship.rotation.y));
  shell.userData = { vel: dir.multiplyScalar(42), life: 130 };
  scene.add(shell);
  playerProj.push(shell);

  // Muzzle flash
  spawnExplosion(shell.position.clone(), 0.3, 0xffdd00);

  setTimeout(() => { cannonReady = true; }, RELOAD_MS);
}

/** Move all projectiles and check collisions each frame */
function updateProjectiles() {
  /* --- Player shells --- */
  for (let i = playerProj.length - 1; i >= 0; i--) {
    const s = playerProj[i];
    s.position.add(s.userData.vel);
    if (--s.userData.life <= 0) { scene.remove(s); playerProj.splice(i, 1); continue; }

    // Check hits on each enemy
    for (let j = enemies.length - 1; j >= 0; j--) {
      if (s.position.distanceTo(enemies[j].position) < 145) {
        spawnExplosion(s.position.clone(), 1.0, 0xff6600);
        scene.remove(s); playerProj.splice(i, 1);

        if (--enemies[j].userData.hp <= 0) {
          spawnExplosion(enemies[j].position.clone(), 2.2, 0xff3300);
          scene.remove(enemies[j]); enemies.splice(j, 1);
          totalKills++;
          onEnemyKilled();
        }
        break;
      }
    }
  }

  /* --- Enemy shells --- */
  for (let i = enemyProj.length - 1; i >= 0; i--) {
    const s = enemyProj[i];
    s.position.add(s.userData.vel);
    if (--s.userData.life <= 0) { scene.remove(s); enemyProj.splice(i, 1); continue; }

    if (ship && s.position.distanceTo(ship.position) < 195) {
      spawnExplosion(s.position.clone(), 0.9, 0xff4400);
      scene.remove(s); enemyProj.splice(i, 1);
      damagePlayer(14);
    }
  }
}

// ============================================================
//  SECTION 9 — EXPLOSION PARTICLES
// ============================================================

/** Spawn a burst of glowing particles at a world position */
function spawnExplosion(pos, scale, color) {
  const count = Math.round(10 * scale);
  const parts = [];
  for (let i = 0; i < count; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(7 * scale, 4, 4),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 })
    );
    p.position.copy(pos);
    p.userData.vel = new THREE.Vector3(
      (Math.random() - 0.5) * 18 * scale,
       Math.random()        * 14 * scale,
      (Math.random() - 0.5) * 18 * scale
    );
    scene.add(p);
    parts.push(p);
  }
  explosions.push({ parts, life: 1.0 });
}

function updateExplosions(dt) {
  for (let i = explosions.length - 1; i >= 0; i--) {
    const e = explosions[i];
    e.life -= dt * 1.6;
    e.parts.forEach(p => {
      p.position.add(p.userData.vel);
      p.userData.vel.y         -= 0.45;        // gravity
      p.userData.vel.multiplyScalar(0.94);     // drag
      p.material.opacity = Math.max(0, e.life);
    });
    if (e.life <= 0) { e.parts.forEach(p => scene.remove(p)); explosions.splice(i, 1); }
  }
}

// ============================================================
//  SECTION 10 — HEALTH SYSTEM
// ============================================================

function damagePlayer(amount) {
  if (!isAlive) return;
  playerHP = Math.max(0, playerHP - amount);
  refreshHealthBar();

  // Screen flash
  const fl = document.getElementById('dmg-flash');
  fl.classList.add('on');
  setTimeout(() => fl.classList.remove('on'), 180);

  if (playerHP <= 0) doGameOver();
}

function refreshHealthBar() {
  const pct = (playerHP / MAX_HP) * 100;
  const bar = document.getElementById('health-bar');
  bar.style.width = pct + '%';
  bar.style.background = pct > 60
    ? 'linear-gradient(90deg,#00ff88,#00ffcc)'
    : pct > 30
    ? 'linear-gradient(90deg,#ffaa00,#ffcc00)'
    : 'linear-gradient(90deg,#ff4040,#ff6600)';
}

// ============================================================
//  SECTION 11 — MISSION SYSTEM
// ============================================================

function startMission(idx) {
  missionIdx    = idx;
  missionActive = true;
  const m = MISSIONS[idx];

  // Reset per-mission fields
  if (m.type === 'destroy')    m.progress = 0;
  if (m.type === 'survive')    m.elapsed  = 0;
  if (m.type === 'checkpoint') { m.reached = false; checkpointMarker.visible = true; }
  else if (checkpointMarker)   checkpointMarker.visible = false;

  document.getElementById('mission-name-hud').textContent = m.name;
  document.getElementById('mission-obj-hud').textContent  = m.objective;
  document.getElementById('mission-prog-bar').style.width = '0%';

  spawnEnemies(m.enemyCount || 0);
}

/** Called when a player shell destroys an enemy */
function onEnemyKilled() {
  const m = MISSIONS[missionIdx];
  if (m.type !== 'destroy') return;
  m.progress++;
  const pct = (m.progress / m.target) * 100;
  document.getElementById('mission-prog-bar').style.width  = pct + '%';
  document.getElementById('mission-obj-hud').textContent   = `Destroy ships: ${m.progress}/${m.target}`;
  if (m.progress >= m.target) missionSuccess();
}

/** Run mission-specific update logic each frame */
function updateMission(dt) {
  if (!missionActive || !isAlive || !ship) return;
  const m = MISSIONS[missionIdx];

  if (m.type === 'survive') {
    m.elapsed += dt;
    const pct  = Math.min(100, (m.elapsed / m.duration) * 100);
    document.getElementById('mission-prog-bar').style.width = pct + '%';
    document.getElementById('mission-obj-hud').textContent  =
      `Survive: ${Math.ceil(m.duration - m.elapsed)}s remaining`;
    // Trickle new enemies if the sea is quiet
    if (enemies.length < 3 && Math.random() < 0.008) spawnEnemies(1);
    if (m.elapsed >= m.duration) missionSuccess();
  }

  if (m.type === 'checkpoint') {
    const d   = ship.position.distanceTo(m.checkpointPos);
    const pct = Math.min(100, Math.max(0, (1 - d / 9000) * 100));
    document.getElementById('mission-prog-bar').style.width = pct + '%';
    document.getElementById('mission-obj-hud').textContent  = `Navigate to zone: ${Math.round(d)} m`;
    if (checkpointMarker) checkpointMarker.rotation.y += dt * 0.55;
    if (d < m.radius && !m.reached) { m.reached = true; missionSuccess(); }
  }
}

function missionSuccess() {
  missionActive = false;
  const m = MISSIONS[missionIdx];
  // Clean up projectiles / enemies
  [...enemies, ...playerProj, ...enemyProj].forEach(o => scene.remove(o));
  enemies.length = playerProj.length = enemyProj.length = 0;

  document.getElementById('complete-sub').textContent = m.name + ' — SUCCESS';
  const isLast = missionIdx >= MISSIONS.length - 1;
  document.getElementById('btn-next').textContent = isLast ? '▶  REPLAY' : '▶  NEXT MISSION';
  setGameState(STATE.COMPLETE);
}

// ============================================================
//  SECTION 12 — GAME LIFECYCLE
// ============================================================

function startGame() {
  if (!ship) return; // model still loading

  // Reset player state
  playerHP     = MAX_HP;
  isAlive      = true;
  cannonReady  = true;
  totalKills   = shotsFired = gameTimeSec = 0;
  speed        = targetSpeed = 0;

  // Reset ship position
  ship.position.set(0, -15, -400);
  ship.rotation.set(0, 0, 0);

  // Wipe any leftover scene objects
  [...enemies, ...playerProj, ...enemyProj].forEach(o => scene.remove(o));
  enemies.length = playerProj.length = enemyProj.length = 0;

  refreshHealthBar();
  setGameState(STATE.PLAYING);
  startMission(missionIdx);
}

function doGameOver() {
  isAlive = missionActive = false;
  spawnExplosion(ship.position.clone(), 3.2, 0xff2200);
  setTimeout(() => {
    document.getElementById('go-stats').innerHTML =
      `MISSION: ${MISSIONS[missionIdx].name}<br>` +
      `KILLS: ${totalKills} &nbsp;|&nbsp; SHOTS: ${shotsFired}<br>` +
      `TIME SURVIVED: ${Math.floor(gameTimeSec)}s`;
    setGameState(STATE.GAMEOVER);
  }, 1400);
}

function togglePause() {
  if      (gameState === STATE.PLAYING) setGameState(STATE.PAUSED);
  else if (gameState === STATE.PAUSED)  setGameState(STATE.PLAYING);
}

// ============================================================
//  SECTION 13 — RADAR
// ============================================================

function drawRadar() {
  const cv  = document.getElementById('radar-canvas');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const cx = W/2, cy = H/2, R = W/2 - 3;
  const worldRange = 5500;
  const sc = R / worldRange;

  // Background
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2); ctx.clip();
  ctx.fillStyle = 'rgba(0,14,4,0.92)'; ctx.fillRect(0,0,W,H);

  // Range circles
  ctx.strokeStyle = 'rgba(0,180,70,0.28)'; ctx.lineWidth = 1;
  [0.33, 0.66, 1].forEach(f => {
    ctx.beginPath(); ctx.arc(cx, cy, R*f, 0, Math.PI*2); ctx.stroke();
  });
  // Cross
  ctx.beginPath();
  ctx.moveTo(3, cy); ctx.lineTo(W-3, cy);
  ctx.moveTo(cx, 3); ctx.lineTo(cx, H-3);
  ctx.stroke();

  // Rotating sweep line
  const sweep = (Date.now() / 900) % (Math.PI * 2);
  ctx.strokeStyle = 'rgba(0,255,80,0.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(sweep)*R, cy + Math.sin(sweep)*R);
  ctx.stroke();

  if (!ship) { ctx.restore(); return; }

  // Enemy dots (red)
  enemies.forEach(e => {
    const dx = (e.position.x - ship.position.x) * sc;
    const dz = (e.position.z - ship.position.z) * sc;
    if (dx*dx + dz*dz > R*R) return;
    ctx.fillStyle = '#ff4040';
    ctx.beginPath(); ctx.arc(cx+dx, cy+dz, 4, 0, Math.PI*2); ctx.fill();
  });

  // Checkpoint dot (green)
  if (checkpointMarker && checkpointMarker.visible) {
    const dx = (checkpointMarker.position.x - ship.position.x) * sc;
    const dz = (checkpointMarker.position.z - ship.position.z) * sc;
    if (dx*dx + dz*dz <= R*R) {
      ctx.fillStyle = '#00ff88';
      ctx.beginPath(); ctx.arc(cx+dx, cy+dz, 5, 0, Math.PI*2); ctx.fill();
    }
  }

  // Player (cyan with heading line)
  ctx.fillStyle = '#00ffff';
  ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI*2); ctx.fill();
  const hx = Math.cos(-ship.rotation.y - Math.PI/2) * 14;
  const hy = Math.sin(-ship.rotation.y - Math.PI/2) * 14;
  ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx+hx, cy+hy); ctx.stroke();

  ctx.restore();
}

// ============================================================
//  SECTION 14 — UI / CONTROLS SETUP
// ============================================================

function setupControls() {
  /* Camera drag — skip if touch lands on a control button */
  const notBtn = e => !e.target.closest('.btn, #zoom-slider');
  window.addEventListener('touchstart', e => {
    if (!notBtn(e)) return;
    isDragging = true; px = e.touches[0].pageX; py = e.touches[0].pageY;
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (!isDragging) return;
    theta -= (e.touches[0].pageX - px) * 0.007;
    phi    = Math.max(0.1, Math.min(Math.PI/2.1, phi - (e.touches[0].pageY - py) * 0.007));
    px = e.touches[0].pageX; py = e.touches[0].pageY;
  }, { passive: true });
  window.addEventListener('touchend', () => isDragging = false);

  /* Mouse camera drag (desktop) */
  window.addEventListener('mousedown', e => {
    if (e.target.closest('.btn,.screen-btn,#zoom-slider')) return;
    isDragging = true; px = e.clientX; py = e.clientY;
  });
  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    theta -= (e.clientX - px) * 0.005;
    phi    = Math.max(0.1, Math.min(Math.PI/2.1, phi - (e.clientY - py) * 0.005));
    px = e.clientX; py = e.clientY;
  });
  window.addEventListener('mouseup', () => isDragging = false);

  /* Zoom slider */
  document.getElementById('zoom-slider').oninput = e => {
    zoomDist = parseFloat(e.target.value);
    document.getElementById('z-val').textContent = Math.round(zoomDist);
  };

  /* Movement & fire buttons — both touch and mouse */
  const bindBtn = (id, down, up) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('touchstart', e => { e.preventDefault(); down(); }, { passive: false });
    el.addEventListener('touchend',   e => { e.preventDefault(); if(up) up(); }, { passive: false });
    el.addEventListener('mousedown',  e => { e.preventDefault(); down(); });
    el.addEventListener('mouseup',    () => { if(up) up(); });
  };

  bindBtn('btn-l', () => input.l = true,  () => input.l = false);
  bindBtn('btn-r', () => input.r = true,  () => input.r = false);
  bindBtn('btn-g', () => input.g = true,  () => input.g = false);
  bindBtn('btn-s', () => input.s = true,  () => input.s = false);
  bindBtn('btn-fire', playerFire, null);
  bindBtn('btn-pause', togglePause, null);

  /* Keyboard (desktop) */
  window.addEventListener('keydown', e => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft')  input.l = true;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') input.r = true;
    if (e.code === 'KeyW' || e.code === 'ArrowUp')    input.g = true;
    if (e.code === 'KeyS' || e.code === 'ArrowDown')  input.s = true;
    if (e.code === 'Space')  { e.preventDefault(); playerFire(); }
    if (e.code === 'Escape') togglePause();
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft')  input.l = false;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') input.r = false;
    if (e.code === 'KeyW' || e.code === 'ArrowUp')    input.g = false;
    if (e.code === 'KeyS' || e.code === 'ArrowDown')  input.s = false;
  });
}

function setupScreenButtons() {
  document.getElementById('btn-play').onclick = () => { missionIdx = 0; startGame(); };
  document.getElementById('btn-resume').onclick          = togglePause;
  document.getElementById('btn-restart').onclick         = () => { missionIdx = 0; startGame(); };
  document.getElementById('btn-restart-pause').onclick   = () => { missionIdx = 0; startGame(); };
  document.getElementById('btn-restart-complete').onclick= () => { missionIdx = 0; startGame(); };
  document.getElementById('btn-next').onclick            = () => {
    missionIdx = (missionIdx + 1) % MISSIONS.length;
    startGame();
  };
}

// ============================================================
//  SECTION 15 — MAIN ANIMATION LOOP
// ============================================================

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t  = clock.elapsedTime;

  // Water always animates (visible on start screen too)
  water.material.uniforms['time'].value += dt;

  // Float objects bob on the surface
  floatingObjs.forEach(o => {
    o.position.y = Math.sin(t * o.userData.fSpeed + o.userData.fOffset) * 11;
  });

  // If not actively playing, just render
  if (gameState !== STATE.PLAYING || !ship || !isAlive) {
    updateCamera();
    renderer.render(scene, camera);
    return;
  }

  // ---- GAMEPLAY ----
  gameTimeSec += dt;

  /* -- Ship movement (original logic preserved) -- */
  speed += (targetSpeed - speed) * 0.005;
  if (input.g) targetSpeed = 0.6;
  if (input.s) targetSpeed = 0;

  if (speed > 0.01) {
    const turn = (input.l ? 1 : 0) - (input.r ? 1 : 0);
    ship.rotation.y += turn * 0.004 * (speed / 0.6);
  }

  ship.position.z -= Math.cos(ship.rotation.y) * speed * 8;
  ship.position.x -= Math.sin(ship.rotation.y) * speed * 8;

  // Gentle wave rocking on the carrier
  ship.position.y  = -15 + Math.sin(t * 0.38) * 2.8;
  ship.rotation.z  = Math.sin(t * 0.28) * 0.012;

  /* -- Systems -- */
  updateEnemies();
  updateProjectiles();
  updateExplosions(dt);
  updateMission(dt);
  drawRadar();
  refreshReloadBar();

  /* -- HUD text -- */
  document.getElementById('v-val').textContent = Math.floor(speed * 45);

  updateCamera();
  renderer.render(scene, camera);
}

/** Position the camera in its orbit around the ship */
function updateCamera() {
  if (!ship) return;
  const ox = zoomDist * Math.sin(phi) * Math.sin(theta);
  const oy = zoomDist * Math.cos(phi);
  const oz = zoomDist * Math.sin(phi) * Math.cos(theta);
  camera.position.set(ship.position.x + ox, ship.position.y + oy, ship.position.z + oz);
  camera.lookAt(ship.position.x, ship.position.y + 15, ship.position.z);
}

/** Animate the cannon reload bar */
function refreshReloadBar() {
  const fill  = document.getElementById('reload-fill');
  const count = document.getElementById('ammo-count');
  if (cannonReady) {
    fill.style.width  = '100%';
    count.textContent = '●';
    count.style.color = '#ffaa00';
  } else {
    const pct = Math.min(100, ((Date.now() - reloadStart) / RELOAD_MS) * 100);
    fill.style.width  = pct + '%';
    count.textContent = '○';
    count.style.color = '#664400';
  }
}

// ---- Boot ----
setGameState(STATE.START);
</script>
